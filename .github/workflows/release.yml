name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Plugin version: ${VERSION}"

      - name: Prepare plugin directory
        run: |
          mkdir -p build
          rsync -av --exclude-from=.distignore ./ build/heads-up-mailer/

      - name: Build release zips
        # Build the versioned zip once, then copy it to the generic
        # filename so both artifacts are guaranteed byte-identical
        # (same SHA256, just different filenames). The in-plugin
        # updater prefers the generic name; humans tend to download
        # the versioned one.
        run: |
          cd build
          zip -r heads-up-mailer-${{ steps.get_version.outputs.version }}.zip heads-up-mailer/
          cp heads-up-mailer-${{ steps.get_version.outputs.version }}.zip heads-up-mailer.zip
          cd ..

      - name: Upload versioned zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: heads-up-mailer-${{ steps.get_version.outputs.version }}
          path: build/heads-up-mailer-${{ steps.get_version.outputs.version }}.zip

      - name: Upload generic zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: heads-up-mailer
          path: build/heads-up-mailer.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/heads-up-mailer-${{ steps.get_version.outputs.version }}.zip
            build/heads-up-mailer.zip
          body: |
            **Heads Up Mailer v${{ steps.get_version.outputs.version }}**

            Lightweight in-house newsletter sender for WordPress: async send queue, RFC 8058 one-click unsubscribe, IMAP poll for mailto-form unsubscribes, plus integrations for Contact Form 7 and WooCommerce.

            Download `heads-up-mailer.zip` and install via WordPress admin (Plugins → Add New → Upload Plugin), or upload to your `wp-content/plugins/` directory.

            Sites running a previous version will receive this update automatically via the in-plugin GitHub updater.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
